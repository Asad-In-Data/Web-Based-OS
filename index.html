<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OS Simulator</title>
    <link rel="stylesheet" href="os-styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&family=Outfit:wght@300;500;700&display=swap" rel="stylesheet">
</head>
<body>
    <!-- Desktop -->
    <div class="desktop" id="desktop">
        <!-- Desktop Icons -->
        <div class="desktop-icons">
            <div class="desktop-icon" data-app="compressor">
                <div class="icon-img">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
                        <polyline points="7 10 12 15 17 10"/>
                        <line x1="12" y1="15" x2="12" y2="3"/>
                    </svg>
                </div>
                <span>Compressor</span>
            </div>

            <div class="desktop-icon" data-app="scheduler">
                <div class="icon-img">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="12" cy="12" r="10"/>
                        <polyline points="12 6 12 12 16 14"/>
                    </svg>
                </div>
                <span>Scheduler</span>
            </div>

            <div class="desktop-icon" data-app="taskmanager">
                <div class="icon-img">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <line x1="4" y1="21" x2="4" y2="14"/>
                        <line x1="4" y1="10" x2="4" y2="3"/>
                        <line x1="12" y1="21" x2="12" y2="9"/>
                        <line x1="12" y1="5" x2="12" y2="3"/>
                        <line x1="20" y1="21" x2="20" y2="16"/>
                        <line x1="20" y1="12" x2="20" y2="3"/>
                    </svg>
                </div>
                <span>Task Manager</span>
            </div>

            <div class="desktop-icon" data-app="settings">
                <div class="icon-img">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="12" cy="12" r="3"/>
                        <path d="M12 1v6m0 6v6m8.66-15.66l-4.24 4.24m-5.66 5.66L6.34 22.66M23 12h-6m-6 0H1m20.66 8.66l-4.24-4.24m-5.66-5.66L6.34 1.34"/>
                    </svg>
                </div>
                <span>Settings</span>
            </div>
        </div>
    </div>

    <!-- Windows Container -->
    <div id="windowsContainer"></div>

    <!-- Taskbar -->
    <div class="taskbar">
        <div class="taskbar-left">
            <button class="start-button" id="startBtn">
                <svg viewBox="0 0 24 24" fill="currentColor">
                    <rect x="3" y="3" width="7" height="7"/>
                    <rect x="14" y="3" width="7" height="7"/>
                    <rect x="3" y="14" width="7" height="7"/>
                    <rect x="14" y="14" width="7" height="7"/>
                </svg>
            </button>
            <div class="taskbar-apps" id="taskbarApps"></div>
        </div>
        
        <div class="taskbar-right">
            <div class="system-tray">
                <div class="tray-item" title="Running Processes">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="12" cy="12" r="10"/>
                    </svg>
                    <span id="processCount">0</span>
                </div>
                <div class="tray-item" id="clockTray">00:00</div>
            </div>
        </div>
    </div>

    <!-- Start Menu -->
    <div class="start-menu" id="startMenu">
        <div class="start-header">Applications</div>
        <div class="start-items">
            <div class="start-item" data-app="compressor">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
                    <polyline points="7 10 12 15 17 10"/>
                    <line x1="12" y1="15" x2="12" y2="3"/>
                </svg>
                <span>File Compressor</span>
            </div>
            <div class="start-item" data-app="scheduler">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <circle cx="12" cy="12" r="10"/>
                    <polyline points="12 6 12 12 16 14"/>
                </svg>
                <span>Round Robin Scheduler</span>
            </div>
            <div class="start-item" data-app="taskmanager">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <line x1="4" y1="21" x2="4" y2="14"/>
                    <line x1="12" y1="21" x2="12" y2="9"/>
                    <line x1="20" y1="21" x2="20" y2="16"/>
                </svg>
                <span>Task Manager</span>
            </div>
            <div class="start-item" data-app="settings">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <circle cx="12" cy="12" r="3"/>
                    <path d="M12 1v6m0 6v6"/>
                </svg>
                <span>Settings</span>
            </div>
        </div>
    </div>

    <!-- Window Templates -->
    <template id="windowTemplate">
        <div class="window" data-window-id="">
            <div class="window-titlebar">
                <div class="window-title"></div>
                <div class="window-controls">
                    <button class="control-btn minimize-btn">−</button>
                    <button class="control-btn maximize-btn">□</button>
                    <button class="control-btn close-btn">×</button>
                </div>
            </div>
            <div class="window-content"></div>
        </div>
    </template>

    <script src="os-core.js"></script>
    <script src="app-compressor.js"></script>
    <script src="app-scheduler.js"></script>
    <script src="app-taskmanager.js"></script>
    <script src="app-settings.js"></script>
    <script src="os-main.js"></script>
</body>
</html>
